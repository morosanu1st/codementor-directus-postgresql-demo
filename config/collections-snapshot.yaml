# Illustrative Directus collection definitions for the SQL schema.
# Not a full official snapshot export — enough to show modeling intent in mentoring.

version: 1
collections:
  - collection: categories
    meta:
      accountability: all
      collection: categories
      icon: category
      note: Product categories (M2O target for products)
      display_template: "{{name}}"
    schema:
      name: categories

  - collection: products
    meta:
      accountability: all
      collection: products
      icon: inventory_2
      note: Sellable products linked to a category
      display_template: "{{name}} ({{sku}})"
    schema:
      name: products

fields:
  - collection: categories
    field: id
    type: uuid
    meta:
      hidden: true
      readonly: true
      interface: input
    schema:
      is_primary_key: true
      has_auto_increment: false

  - collection: categories
    field: name
    type: string
    meta:
      interface: input
      required: true
    schema:
      is_nullable: false

  - collection: categories
    field: slug
    type: string
    meta:
      interface: input
      required: true
      note: URL-safe unique key
    schema:
      is_nullable: false
      is_unique: true

  - collection: products
    field: id
    type: uuid
    meta:
      hidden: true
      readonly: true
    schema:
      is_primary_key: true

  - collection: products
    field: name
    type: string
    meta:
      interface: input
      required: true

  - collection: products
    field: sku
    type: string
    meta:
      interface: input
      required: true

  - collection: products
    field: price
    type: decimal
    meta:
      interface: input
      required: true

  - collection: products
    field: is_active
    type: boolean
    meta:
      interface: boolean
      special:
        - cast-boolean

  - collection: products
    field: category
    type: uuid
    meta:
      interface: select-dropdown-m2o
      special:
        - m2o
      note: M2O → categories
    schema:
      foreign_key_table: categories
      foreign_key_column: id

relations:
  - collection: products
    field: category
    related_collection: categories
    meta:
      one_collection: categories
      many_collection: products
      many_field: category
      one_deselect_action: nullify
    schema:
      table: products
      column: category
      foreign_key_table: categories
      foreign_key_column: id
      on_delete: SET NULL
